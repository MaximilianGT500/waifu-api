name: Docker

on:
  push:
    branches: [ "main" ]
    # Publish semver tags as releases.
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Calculate version
        id: version
        # Pass GitHub context via env instead of interpolating it into the script (prevents script injection).
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          RELEASE=false
          PRERELEASE=false
          LATEST=false
          if [[ "$REF_TYPE" == "tag" ]]; then
            RELEASE=true
            VERSION="$REF_NAME"
            VERSION="${VERSION#v}"
            # SemVer with an optional pre-release part (e.g. 1.4.0-rc.1); only characters valid in image tags.
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Refusing to build unexpected tag '$REF_NAME'" >&2
              exit 1
            fi
            if [[ "$VERSION" == *-* ]]; then
              PRERELEASE=true
            else
              # "latest" only moves forward: a hotfix for an older line (v7.4.5 after v8.1.0) keeps it where it is.
              HIGHEST=$(git tag --list 'v*.*.*' | sed 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
              if [[ "$VERSION" == "$HIGHEST" ]]; then
                LATEST=true
              fi
            fi
          else
            # Branch/PR builds are not releases: they are published as "main" and "sha-<commit>" only.
            VERSION="0.0.0"
          fi

          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)

          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "MAJOR=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "MAJOR_MINOR=$MAJOR.$MINOR" >> "$GITHUB_OUTPUT"
          echo "RELEASE=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "LATEST=$LATEST" >> "$GITHUB_OUTPUT"

          echo "Calculated version: $VERSION (release: $RELEASE, pre-release: $PRERELEASE, latest: $LATEST)"

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@4959ce089c160fddf62f7b42464195ba1a56d382 # v3.6.0
        with:
          cosign-release: 'v2.2.4'

      # Set up Buildx runner buildkit
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          # Releases get vX.Y.Z (pre-releases only that); vX.Y and vX follow their release line, "latest" the highest
          # release. Pushes to main are published as "main" and "sha-<commit>".
          tags: |
            type=raw,value=latest,enable=${{ steps.version.outputs.LATEST == 'true' }}
            type=raw,value=v${{ steps.version.outputs.VERSION }},enable=${{ steps.version.outputs.RELEASE == 'true' }}
            type=raw,value=v${{ steps.version.outputs.MAJOR_MINOR }},enable=${{ steps.version.outputs.RELEASE == 'true' && steps.version.outputs.PRERELEASE != 'true' }}
            type=raw,value=v${{ steps.version.outputs.MAJOR }},enable=${{ steps.version.outputs.RELEASE == 'true' && steps.version.outputs.PRERELEASE != 'true' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ steps.version.outputs.RELEASE != 'true' }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Backend Docker image
        id: build-and-push-backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          # Releases get vX.Y.Z (pre-releases only that); vX.Y and vX follow their release line, "latest" the highest
          # release. Pushes to main are published as "main" and "sha-<commit>".
          tags: |
            type=raw,value=latest,enable=${{ steps.version.outputs.LATEST == 'true' }}
            type=raw,value=v${{ steps.version.outputs.VERSION }},enable=${{ steps.version.outputs.RELEASE == 'true' }}
            type=raw,value=v${{ steps.version.outputs.MAJOR_MINOR }},enable=${{ steps.version.outputs.RELEASE == 'true' && steps.version.outputs.PRERELEASE != 'true' }}
            type=raw,value=v${{ steps.version.outputs.MAJOR }},enable=${{ steps.version.outputs.RELEASE == 'true' && steps.version.outputs.PRERELEASE != 'true' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ steps.version.outputs.RELEASE != 'true' }}

      # Build and push Docker image with Buildx (don't push on PR)
      - name: Build and push Frontend Docker image
        id: build-and-push-frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Backend Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta-backend.outputs.tags }}
          DIGEST: ${{ steps.build-and-push-backend.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

      - name: Sign the published Frontend Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta-frontend.outputs.tags }}
          DIGEST: ${{ steps.build-and-push-frontend.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}
