name: Deploy Documentation

on:
  push:
    # Trigger ONLY on version tags
    tags: [ 'v*.*.*' ]
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Least privilege: the build job (which runs third-party npm code) can only read the repository; only the
# deploy job may publish to GitHub Pages and request an OIDC token.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  DOCS_URL: ${{ vars.DOCS_URL || 'https://docs.waifu.im' }}
  DOCS_BASE_URL: /
  DOCS_ORG_NAME: ${{ vars.DOCS_ORG_NAME || 'Waifu-im' }}
  DOCS_PROJECT_NAME: waifu-api
  API_BASE_URL: ${{ vars.API_BASE_URL || 'https://api.waifu.im' }}
  APP_NAME: ${{ vars.APP_NAME || 'Waifu.im' }}
  APP_TAGLINE: "The API for your Waifu content. Access thousands of categorized anime illustrations via our robust REST API or browse freely."
  FRONTEND_URL: ${{ vars.FRONTEND_URL || 'https://www.waifu.im' }}
  GITHUB_URL: ${{ vars.GITHUB_URL || 'https://github.com/Waifu-im/waifu-api' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all tags
        run: git fetch --tags --force

      # The OpenAPI spec is checked in at openapi/WaifuApi.Web.json (maintained
      # together with the Go backend). No backend build is needed here anymore.

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate API docs from OpenAPI spec
        working-directory: docs
        run: npx docusaurus gen-api-docs all

      - name: Build documentation
        working-directory: docs
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
