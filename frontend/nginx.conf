# HSTS is only meaningful behind a TLS-terminating proxy; it is sent when the proxy reports HTTPS.
map $http_x_forwarded_proto $hsts_header {
    default "";
    https   "max-age=31536000";
}

# Long-lived caching only for successful responses: a 404 for a chunk that is still being deployed must not be
# cached for a year by browsers or a CDN.
map $status $assets_cache_control {
    ~^[23]  "public, max-age=31536000, immutable";
    default "no-store";
}

map $status $static_cache_control {
    ~^[23]  "public, max-age=604800";
    default "no-store";
}

# Design switch: the SPA document is picked by the waifu_design cookie, so both builds share the same URLs.
map $cookie_waifu_design $spa_document {
    classic /classic.html;
    default /index.html;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    # Disable access logs for better performance
    access_log off;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml image/x-icon;

    # Security headers (incl. the Content-Security-Policy) are generated from the container environment at
    # startup. nginx drops inherited add_header directives in blocks that define their own, so every location
    # includes the snippet.
    include /etc/nginx/snippets/security-headers.conf;

    # Generated from container environment variables at startup: always fetch the current runtime configuration.
    location = /config.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /site.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        types { }
        default_type application/manifest+json;
    }

    location = /init.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Never serve dotfiles (e.g. a stray .env in the web root); /.well-known/ stays reachable. Regex locations are
    # checked in order, so this one comes before the static-file pattern below.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Hashed build output never changes: cache it forever. A missing chunk must be a real 404 (not index.html),
    # so clients running an older build notice it and reload. ^~ skips the regex locations above, hence the nested
    # dotfile rule.
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $assets_cache_control always;
        location ~ /\. {
            return 404;
        }
        try_files $uri =404;
    }

    # Unhashed static files (icons, logo). They are referenced with a version query string.
    location ~* \.(?:png|jpe?g|gif|ico|svg|webp|avif|woff2?|ttf)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $static_cache_control always;
        try_files $uri =404;
    }

    # The two SPA documents are only reachable through the fallback below. They differ per visitor (design cookie),
    # so shared caches must not store them and browsers must revalidate them.
    location = /index.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, private" always;
        add_header Vary "Cookie" always;
    }

    location = /classic.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, private" always;
        add_header Vary "Cookie" always;
    }

    # SPA routing - serve the document of the chosen design for all other routes and always revalidate it.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, private" always;
        add_header Vary "Cookie" always;
        try_files $uri $spa_document;
    }
}
