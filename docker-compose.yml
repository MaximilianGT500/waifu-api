name: waifu-api
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # In Docker the redirect target is always the public frontend URL.
      - DISCORD_REDIRECT_URI=${FRONTEND_URL:-http://localhost:5173}/auth/callback
    volumes:
      # Serve the checked-in OpenAPI spec at /openapi/v1.json (+ Scalar UI at /scalar).
      - ./openapi/WaifuApi.Web.json:/app/openapi.json:ro
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # VITE_* values are interpolated from the .env file here and turned into
      # /config.js by the container entrypoint at startup.
      VITE_API_URL: "${API_BASE_URL:-}"
      VITE_DISCORD_CLIENT_ID: "${VITE_DISCORD_CLIENT_ID:-}"
      VITE_DISCORD_REDIRECT_URI: "${VITE_DISCORD_REDIRECT_URI:-http://localhost:5173/auth/callback}"
      VITE_APP_TITLE: "${VITE_APP_TITLE:-Waifu API}"
      VITE_DOCS_URL: "${VITE_DOCS_URL:-}"
      VITE_CONTACT_EMAIL: "${VITE_CONTACT_EMAIL:-}"
      VITE_DISCORD_SERVER_URL: "${VITE_DISCORD_SERVER_URL:-}"
      VITE_STATUS_URL: "${VITE_STATUS_URL:-}"
      VITE_GITHUB_URL: "${VITE_GITHUB_URL:-}"
      VITE_TOS_URL: "${VITE_TOS_URL:-}"
      VITE_IMG_TRANSFORM_ENABLED: "${IMG_TRANSFORM_ENABLED:-false}"
      VITE_IMG_TRANSFORM_PATH: "${IMG_TRANSFORM_PATH:-}"
      VITE_IMG_WIDTH_PARAM: "${IMG_WIDTH_PARAM:-width}"
      VITE_IMG_CARD_WIDTH: "${IMG_CARD_WIDTH:-640}"
      VITE_IMG_PREVIEW_WIDTH: "${IMG_PREVIEW_WIDTH:-1280}"
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: always

  docs:
    build:
      context: .
      dockerfile: docs/Dockerfile
      args:
        VERSION: ${VERSION:-0.0.0}
        DOCS_URL: ${DOCS_URL}
        DOCS_BASE_URL: ${DOCS_BASE_URL}
        DOCS_ORG_NAME: ${DOCS_ORG_NAME}
        DOCS_PROJECT_NAME: ${DOCS_PROJECT_NAME}
        API_BASE_URL: ${API_BASE_URL}
        APP_NAME: ${APP_NAME}
        APP_TAGLINE: ${APP_TAGLINE}
        FRONTEND_URL: ${FRONTEND_URL}
        GITHUB_URL: ${GITHUB_URL}
    ports:
      - "${DOCS_PORT}:80"
    restart: always

  db:
    image: pgvector/pgvector:pg18
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql
    restart: always
    # ports:
    #   - "${POSTGRES_PORT_EXTERNAL}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: